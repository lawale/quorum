name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/lawale/quorum

jobs:
  docker:
    name: Docker Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - variant: api
            dockerfile: Dockerfile
            suffix: ""
            context: .
          - variant: console
            dockerfile: Dockerfile.console
            suffix: "-console"
            context: .
          - variant: all
            dockerfile: Dockerfile.all
            suffix: "-all"
            context: .
          - variant: site
            dockerfile: site/Dockerfile
            suffix: "-site"
            context: .
          - variant: demo-banking
            dockerfile: examples/banking/Dockerfile
            suffix: "-demo-banking"
            context: .
          - variant: demo-expenses
            dockerfile: examples/expenses/Dockerfile
            suffix: "-demo-expenses"
            context: examples/expenses
          - variant: demo-access-portal
            dockerfile: examples/access-portal/Dockerfile
            suffix: "-demo-access-portal"
            context: examples/access-portal
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_BASE }}${{ matrix.suffix }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=long

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

  npm:
    name: npm Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: npm
    strategy:
      fail-fast: false
      matrix:
        package:
          - widgets/frontend
          - clients/typescript
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - run: npm ci

      # Before the build: the client bakes the version into what it ships.
      - name: Set version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version

      - run: npm run build

      - name: Check whether this version is already on npm
        id: registry
        run: |
          NAME="$(node -p 'require("./package.json").name')"
          if npm view "${NAME}@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.registry.outputs.published != 'true'
        run: npm publish --access public --provenance

  nuget:
    name: NuGet Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: clients/dotnet
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: clients/dotnet/global.json

      - name: Pack with the version from the tag
        run: dotnet pack -c Release -p:Version="${GITHUB_REF_NAME#v}" -o out

      - name: Log in to nuget.org
        id: login
        uses: NuGet/login@v1
        with:
          user: OluwaVader

      - name: Push to nuget.org
        run: dotnet nuget push "out/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

  trivy:
    name: Scan Docker Images
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      security-events: write
    strategy:
      matrix:
        image:
          - ""
          - "-console"
          - "-all"
    steps:
      - uses: actions/checkout@v7

      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_BASE }}${{ matrix.image }}:sha-${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.image || 'api' }}.sarif

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-${{ matrix.image || 'api' }}.sarif
          category: trivy-${{ matrix.image || 'api' }}

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [docker, npm, nuget]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > notes.md <<EOF
          **npm:** \`npm install @oluwavader/quorum-client@${VERSION}\` (client) and \`@oluwavader/quorum-embed@${VERSION}\` (widgets)
          **NuGet:** \`dotnet add package Quorum.Client --version ${VERSION}\` (also \`Quorum.Client.MediatR\`)
          **Docker:** \`ghcr.io/lawale/quorum:${VERSION}\` (also \`-console\`, \`-all\`, \`-site\`, and the \`-demo-*\` sample apps)

          EOF
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            --notes-file notes.md
