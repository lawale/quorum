name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            console/frontend/package-lock.json
            widgets/frontend/package-lock.json
      - run: cd console/frontend && npm ci && npm run build
      - run: cd widgets/frontend && npm ci && npm run build
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 ./...

  integration-postgres:
    name: Integration (Postgres)
    runs-on: ubuntu-latest
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -tags=integration -race -count=1 -timeout=10m ./internal/store/postgres/

  integration-mssql:
    name: Integration (MSSQL)
    runs-on: ubuntu-latest
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -tags=integration -race -count=1 -timeout=10m ./internal/store/mssql/

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build ./cmd/server
      - name: Build banking example against the Go client
        run: cd examples/banking && go build ./...

  build-console:
    name: Build (Console)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/frontend/package-lock.json
      - run: cd console/frontend && npm ci && npm run build
      - run: go build -tags console ./cmd/server

  build-site:
    name: Build (Site)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: cd site && npm ci && npm run build

  build-embed:
    name: Build (Embed Widgets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: widgets/frontend/package-lock.json
      - run: cd widgets/frontend && npm ci && npm run build
      - run: go build -tags embed ./cmd/server

  client-typescript:
    name: TypeScript Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json
      - run: npm ci
      - name: Generated types match api/openapi.yaml
        run: npm run check:generated
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  client-dotnet:
    name: .NET Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/dotnet
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: clients/dotnet/global.json
      - run: dotnet build -c Release -warnaserror
      - run: dotnet test -c Release --no-build
      - run: dotnet pack -c Release --no-build -o out
